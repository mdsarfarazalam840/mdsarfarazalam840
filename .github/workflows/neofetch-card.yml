name: Neofetch Card Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'neofetch_stats.py'
      - 'tools/build_neofetch_svg.py'
      - '.github/workflows/neofetch-card.yml'
  schedule:
    - cron: '17 4 * * *' # Once a day, off the hour to dodge the Actions rush

# The job commits the refreshed SVGs and the lines-of-code cache back to main.
permissions:
  contents: write

jobs:
  build-card:
    runs-on: ubuntu-latest
    # A first run with no cache walks every repository, but anything past this is
    # a hang, not slow progress.
    timeout-minutes: 90

    env:
      GIT_USER_NAME: "github-actions[bot]"
      GIT_USER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

    steps:
      - name: Checkout repo (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Refresh stats in both SVGs
        env:
          # GH_TOKEN needs read access to Followers, Starring, Commit statuses,
          # Contents and Metadata. The default GITHUB_TOKEN works for public
          # repos only, and cannot read followers.
          ACCESS_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: mdsarfarazalam840
          # Optional: set a BIRTHDAY repo variable (YYYY-MM-DD) and Uptime counts
          # from your birthday instead of from your GitHub account creation date.
          BIRTHDAY: ${{ vars.BIRTHDAY }}
        run: python neofetch_stats.py

      - name: Commit & push changes
        # always(): if the stats step died anyway, the partial lines-of-code cache
        # it saved is still worth committing, so the next run resumes from there.
        if: always()
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git add dark_mode.svg light_mode.svg cache/
          if git diff --cached --quiet; then
            echo "⟩ No changes detected; skipping commit."
            exit 0
          fi
          git commit -m "🖥️ refresh neofetch profile card"
          # Other scheduled workflows push to main too, so a rejected push only
          # means one of them got there first: rebase onto it and try again.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "⟩ Card updated and pushed."
              exit 0
            fi
            echo "⟩ Push rejected (attempt $attempt); rebasing onto origin/main."
            sleep $((attempt * 5))
            git pull --rebase --autostash origin main || exit 1
          done
          echo "⟩ Could not push after 5 attempts." >&2
          exit 1
